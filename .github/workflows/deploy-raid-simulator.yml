# Publication du simulateur de raid du centre de recherche sur GitHub Pages.
#
# Le simulateur est un site statique construit depuis `tools/raid-simulator/`
# et les fichiers pokedex de `data/`. Il ne contient aucun secret et ne touche
# ni au bot, ni au VPS : ce workflow ne fait que builder un dossier et le
# publier.
#
# Le pokedex publie change quand `data/pokemon-gen*.json` change, d'ou le
# filtre de chemins : une mise a jour du bot sans effet sur le simulateur ne
# declenche pas de republication.
name: Deploy raid simulator

on:
  push:
    branches: [main]
    paths:
      - "tools/raid-simulator/**"
      - "src/scripts/raid-tools/buildRaidSimulator.ts"
      - "src/config/paths.ts"
      - "data/pokemon-gen1.json"
      - "data/pokemon-gen2.json"
      - "data/pokemon-gen3.json"
      - ".github/workflows/deploy-raid-simulator.yml"
  workflow_dispatch:

# Portee minimale par defaut ; chaque job ajoute ce dont il a besoin.
permissions:
  contents: read

# Un seul deploiement Pages a la fois. `cancel-in-progress: false` est
# volontaire : on annule un build, jamais un deploiement a moitie fait.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # `npm ci` et non `npm install` : le site publie est build ici, il doit
      # l'etre avec les versions exactes du lockfile. Sinon une mise a jour de
      # dependance transitive change le simulateur sans qu'aucun commit ne bouge.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Verrous de non-regression, executes avant toute publication :
      # - parite du moteur du simulateur avec celui du bot,
      # - liste blanche des champs du pokedex publie.
      # Un simulateur qui a derive ne doit pas atteindre les joueurs.
      - name: Run simulator guard tests
        run: npx vitest run tests/raid/raidSimulatorParity.test.ts tests/scripts/buildRaidSimulator.test.ts

      - name: Build simulator
        run: npm run raid-sim:build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-web/raid-simulator

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
